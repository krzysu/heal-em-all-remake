<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#3c4556" />
    <meta
      name="description"
      content="Heal'em All — there's a cure for zombies. A remastered HTML5 action platformer."
    />
    <title>Heal'em All</title>

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!-- iOS standalone (fullscreen) launch from the home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Heal'em All" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Jolly+Lodger&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #3c4556;
        overflow: hidden;
        font-family: 'Boogaloo', Arial, sans-serif;
      }
      #game {
        /*
         * Keep the canvas inside the safe area so notches and home indicators
         * never cover the HUD. `viewport-fit=cover` is set above; the env()
         * values are 0 everywhere without an inset.
         */
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
      }
      #game canvas {
        display: block;
        touch-action: none;
      }
      #rotate {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        place-items: center;
        text-align: center;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        background: #3c4556;
        color: #f2da38;
        font-family: 'Jolly Lodger', cursive;
      }
      html.rotate-gate #rotate {
        display: grid;
      }
      #rotate p {
        margin: 0;
        font-size: 44px;
        letter-spacing: 2px;
      }
      #rotate small {
        display: block;
        margin-top: 10px;
        font-family: 'Boogaloo', Arial, sans-serif;
        font-size: 18px;
        color: #9ca2ae;
        letter-spacing: 0;
      }
      #rotate .rotate-icon {
        position: relative;
        width: 68px;
        height: 120px;
        margin: 0 auto 28px;
        border: 5px solid #f2da38;
        border-radius: 12px;
        animation: rotate-hint 1.8s ease-in-out infinite;
      }
      #rotate .rotate-icon::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: 8px;
        width: 26px;
        height: 5px;
        border-radius: 3px;
        background: #f2da38;
        transform: translateX(-50%);
      }
      @keyframes rotate-hint {
        0%,
        25% {
          transform: rotate(0deg);
        }
        60%,
        100% {
          transform: rotate(-90deg);
        }
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #f2da38;
        font-family: 'Jolly Lodger', cursive;
        font-size: 48px;
        letter-spacing: 2px;
        background: #3c4556;
        transition: opacity 0.3s ease;
      }
      #boot.hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate" aria-hidden="true">
      <div>
        <div class="rotate-icon"></div>
        <p>Rotate your device</p>
        <small>Heal'em All plays in landscape</small>
      </div>
    </div>
    <div id="boot">Heal'em All</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
